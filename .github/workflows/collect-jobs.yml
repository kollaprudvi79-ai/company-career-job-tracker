name: Collect employer jobs
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: career-radar-sweep
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r scripts/career_radar/requirements.txt
      - run: python scripts/clean_boards.py
      - name: Commit cleaned boards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Purge dead boards'
          fi
          git pull --rebase -Xours origin main
          git push origin main
      - run: python -m career_radar.discover --repo-root .
        working-directory: scripts
      - name: Commit discovered boards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Discover new boards'
          fi
          git pull --rebase -Xours origin main
          git push origin main
      - name: Continuous sweep (5.5h)
        run: python -m career_radar.cli --repo-root . --continuous --max-hours 5.5
        working-directory: scripts
      - name: Trigger next run
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect-jobs.yml/dispatches \
            -d '{"ref":"main"}'
      - name: Final commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh employer jobs snapshot'
          fi
          git pull --rebase -Xours origin main
          git push origin main
