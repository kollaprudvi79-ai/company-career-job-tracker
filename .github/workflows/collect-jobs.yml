name: Collect employer jobs
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: career-radar-sweep
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r scripts/career_radar/requirements.txt
      - run: node --check scripts/ingest.mjs && node --check scripts/filter-directory.mjs && node --check scripts/job-utils.mjs && node --check scripts/discover.mjs
      - run: node scripts/discover.mjs
      - name: Commit discovered boards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add discovered-boards.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh discovered boards'
          fi
          git pull --rebase -Xours origin main
          git push origin main
      - run: node scripts/ingest.mjs
      - run: python -m career_radar.cli --repo-root . --full
        working-directory: scripts
        env:
          BATCH_SIZE: '100000'
      - run: node scripts/filter-directory.mjs
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh employer jobs snapshot'
          fi
          git pull --rebase -Xours origin main
          git push origin main
