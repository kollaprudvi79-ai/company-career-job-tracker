name: Collect employer jobs
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: career-radar-sweep
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r scripts/career_radar/requirements.txt
      - run: python scripts/clean_boards.py
      - run: python -m career_radar.discover --repo-root .
        working-directory: scripts
      - run: python -m career_radar.cli --repo-root . --full
        working-directory: scripts
        env:
          BATCH_SIZE: '100000'
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh employer jobs snapshot'
          fi
          git pull --rebase -Xours origin main
          git push origin main
